name: Build Lokky Basket Scalper V3

on:
  push:
    branches:
      - build/ctrader-basket-scalper-v3
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore .\ctrader\LokkyBasketScalper\LokkyBasketScalper.csproj

      - name: Build .algo
        run: dotnet build .\ctrader\LokkyBasketScalper\LokkyBasketScalper.csproj --configuration Release -p:AlgoPublish=false -p:IncludeSource=True

      - name: Rename generated package
        shell: pwsh
        run: |
          $algo = Get-ChildItem -Path . -Recurse -Filter *.algo | Select-Object -First 1
          if (-not $algo) { throw 'No .algo file generated' }
          Copy-Item $algo.FullName .\LokkyBasketScalperV3.algo
          Get-Item .\LokkyBasketScalperV3.algo | Select-Object FullName,Length

      - name: Upload .algo
        uses: actions/upload-artifact@v4
        with:
          name: LokkyBasketScalperV3-algo
          path: 'LokkyBasketScalperV3.algo'
          if-no-files-found: error

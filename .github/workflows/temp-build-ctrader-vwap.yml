name: Temporary cTrader VWAP build

on:
  pull_request:
    paths:
      - '.tmp-ctrader-builder/**'
      - '.github/workflows/temp-build-ctrader-vwap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build real cTrader .algo
        working-directory: .tmp-ctrader-builder
        run: |
          dotnet restore FTMO_VWAP_MeanReversion_v1.csproj
          dotnet build FTMO_VWAP_MeanReversion_v1.csproj -c Release --no-restore -warnaserror
          ALGO_PATH="$(find ./bin -type f -name '*.algo' | head -n 1)"
          if [ -z "$ALGO_PATH" ]; then
            echo 'No .algo generated' >&2
            find ./bin -maxdepth 5 -type f -print || true
            exit 1
          fi
          cp "$ALGO_PATH" ./FTMO_VWAP_MeanReversion_v1.algo
          test -s ./FTMO_VWAP_MeanReversion_v1.algo
          echo "Generated from $ALGO_PATH"
          sha256sum ./FTMO_VWAP_MeanReversion_v1.algo

      - name: Upload .algo
        uses: actions/upload-artifact@v4
        with:
          name: FTMO_VWAP_MeanReversion_v1-algo
          path: .tmp-ctrader-builder/FTMO_VWAP_MeanReversion_v1.algo
          if-no-files-found: error
